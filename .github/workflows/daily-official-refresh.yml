name: Daily official chart refresh

on:
  schedule:
    # 10:17 Bangkok; providers publish at different times/days.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-chart-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch source rankings and validate snapshot
        run: node scripts/refresh-official-charts.mjs && node scripts/sync-charts.mjs
      - name: Save verified data for the live website
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "pulse-charts-bot"
          git config user.email "pulse-charts-bot@users.noreply.github.com"
          git add app/charts-main.json app/charts-ost.json public/charts.json
          git commit -m "chore(charts): daily official ranking refresh"
          git pull --rebase origin main
          git push

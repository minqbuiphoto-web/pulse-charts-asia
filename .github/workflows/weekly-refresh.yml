name: Weekly Pulse Charts refresh

on:
  schedule:
    # 09:00 Monday in Bangkok (UTC+7)
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-chart-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Refresh five-track OST albums, measured YouTube views, and verify every chart
        run: npm run refresh:weekly
      - name: Build the production site
        run: npm run build:pages
      - name: Save verified changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No chart data changed."
            exit 0
          fi
          git config user.name "pulse-charts-bot"
          git config user.email "pulse-charts-bot@users.noreply.github.com"
          git add app/charts-*.json public/charts.json
          git commit -m "chore(charts): weekly verified refresh"
          git push
